[package]
name = "audioboard"
version = "0.1.0"
edition = "2024"

[dependencies]
cpal = "0.18.2"
eframe = "0.37.0"
egui = "0.37.0"
midir = "0.11.1"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
vst3-host = { version = "0.10.0", default-features = false }

# Fastest build for playing: whole-program optimisation inlines the
# per-sample DSP across modules and crates (10–15% less audio CPU), but
# takes minutes to build. `cargo build --profile dist`.
[profile.dist]
inherits = "release"
lto = "thin"
codegen-units = 1
