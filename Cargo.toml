[package]
name = "audioboard"
version = "0.1.2"
edition = "2024"

# The node SDK and the UI Kit are their own crates (see README, "Node
# plugins"); `plugins/` holds example node plugins built as dylibs. Plain
# `cargo build`/`cargo test` work on the app alone; add `--workspace` for all.
[workspace]
members = ["crates/audioboard-node", "crates/audioboard-ui", "plugins/*"]

[dependencies]
audioboard-node = { path = "crates/audioboard-node" }
audioboard-ui = { path = "crates/audioboard-ui" }
cpal = "0.18.2"
eframe = "0.37.0"
egui = "0.37.0"
# Stickers and background images (see board.rs).
# Loads node plugins (dynamic libraries, see audio/node_plugin.rs).
libloading = "0.8"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
# SVG stickers, drawn at the size they are shown.
resvg = "0.48"
midir = "0.11.1"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
vst3-host = { version = "0.10.0", default-features = false }

# Compiles the Audio Unit host on macOS (build.rs, src/audio/au_host.m).
[build-dependencies]
cc = "1.2"

# The native window, for what winit doesn't expose (see ui/macos.rs).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSResponder", "NSView", "NSWindow"] }
raw-window-handle = "0.6"

# vst3-host 0.10.0 with one fix (vendor/vst3-host/src/internal/module_info.rs):
# a plugin that declines IPluginCompatibility::getCompatibilityJSON (Kontakt 8
# returns kResultFalse) loads without compatibility data instead of failing.
# Drop this once a release upstream includes the fix.
[patch.crates-io]
vst3-host = { path = "vendor/vst3-host" }

# Fastest build for playing: whole-program optimisation inlines the
# per-sample DSP across modules and crates (10–15% less audio CPU), but
# takes minutes to build. `cargo build --profile dist`.
[profile.dist]
inherits = "release"
lto = "thin"
codegen-units = 1
