[package]
name = "audioboard-example-nodes"
version = "0.1.0"
edition = "2024"
description = "Example AudioBoard node plugin: a few nodes written with the node SDK, built as a dynamic library."
publish = false

# A dynamic library AudioBoard loads at run time (libaudioboard_example_nodes.dylib
# on macOS, .so on Linux, .dll on Windows).
[lib]
crate-type = ["cdylib"]

[dependencies]
audioboard-node = { path = "../../crates/audioboard-node" }
